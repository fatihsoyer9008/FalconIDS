name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Bagimliliklari kur
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libpcap-dev libcurl4-openssl-dev

      - name: Yapilandir (CMake configure)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Derle
        run: cmake --build build --parallel

      - name: Testleri calistir
        run: ctest --test-dir build --output-on-failure
